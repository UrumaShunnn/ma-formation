<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#1A0A2E"/>
    </linearGradient>
    <linearGradient id="vg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#5B21B6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow circle -->
  <circle cx="1050" cy="150" r="280" fill="#7C3AED" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="500" r="200" fill="#5B21B6" opacity="0.08" filter="url(#glow)"/>

  <!-- Border -->
  <rect x="2" y="2" width="1196" height="626" rx="0" fill="none" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Badge -->
  <rect x="80" y="180" width="220" height="36" rx="18" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1"/>
  <text x="190" y="203" font-family="Arial" font-size="14" font-weight="700" fill="#8B5CF6" text-anchor="middle" letter-spacing="2">FORMATION PREMIUM</text>

  <!-- Titre -->
  <text x="80" y="295" font-family="Arial" font-size="64" font-weight="900" fill="#FFFFFF">Lance ta boutique</text>
  <text x="80" y="370" font-family="Arial" font-size="64" font-weight="900" fill="url(#vg)">e-commerce en 90j</text>

  <!-- Sous-titre -->
  <text x="80" y="430" font-family="Arial" font-size="22" fill="#9CA3AF">Méthodes testées · +250 membres · Résultats prouvés</text>

  <!-- Séparateur -->
  <rect x="80" y="460" width="120" height="3" rx="2" fill="url(#vg)"/>

  <!-- Stats -->
  <text x="80" y="510" font-family="Arial" font-size="18" font-weight="700" fill="#8B5CF6">250+ membres</text>
  <text x="80" y="535" font-family="Arial" font-size="14" fill="#6B7280">actifs qui génèrent du CA</text>

  <text x="320" y="510" font-family="Arial" font-size="18" font-weight="700" fill="#8B5CF6">1M€+ générés</text>
  <text x="320" y="535" font-family="Arial" font-size="14" fill="#6B7280">par la communauté</text>

  <text x="560" y="510" font-family="Arial" font-size="18" font-weight="700" fill="#8B5CF6">90 jours</text>
  <text x="560" y="535" font-family="Arial" font-size="14" fill="#6B7280">pour tes premiers résultats</text>
</svg>
